services:
  - type: web
    name: subh-gaming-platform
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    preDeployCommand: npm run db:init
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: subh-gaming-db
          property: connectionString

databases:
  - name: subh-gaming-db
    databaseName: subh_gaming_db
    user: subh_user
    plan: free
    region: oregon

